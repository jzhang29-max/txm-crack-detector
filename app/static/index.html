<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TXM Crack Detection</title>
<style>
/* Design rules for this file, because the previous version violated all three:
   1. Show the FOUR things the workflow needs (load, look, fix, retrain). Every
      other control is a tuning knob and lives behind Advanced.
   2. One primary action visible at a time. Retrain is the only filled button.
   3. Group by task with real whitespace, not by cramming into one flex row. */
:root{
  --bg:#0f1114; --surface:#16191e; --surface2:#1c2027; --line:#252a32;
  --line2:#333a45; --ink:#eceef1; --ink2:#a8aeb8; --ink3:#6f7681;
  --brand:#4f8ef7; --ok:#2ea36b; --warn:#c9822a; --bad:#d64545;
  --r:8px; --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);display:flex;
  font:14px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:var(--ink);background:var(--surface2);cursor:pointer;
  border:1px solid var(--line2);border-radius:var(--r);padding:8px 13px;
  transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:#232833;border-color:#3d4552}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.primary:hover:not(:disabled){background:#5f9bfa;border-color:#5f9bfa}
.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding:6px 9px}
.ghost:hover:not(:disabled){background:var(--surface2);color:var(--ink)}
.danger:hover:not(:disabled){border-color:var(--bad);color:#ff8080}

/* ---------------- sidebar ---------------- */
#side{width:296px;min-width:296px;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--ink3)}
#drop{margin:14px;padding:20px 14px;border:1.5px dashed var(--line2);border-radius:10px;
  text-align:center;color:var(--ink2);cursor:pointer;transition:.14s}
#drop:hover{border-color:#44506b;background:#171c26}
#drop.hot{border-color:var(--brand);background:#17233a;color:var(--ink)}
#drop b{display:block;font-size:13px;font-weight:500;color:var(--ink)}
#drop span{font-size:11px;color:var(--ink3)}
.lbl{padding:12px 18px 6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink3)}
#list{flex:1;overflow-y:auto;padding-bottom:8px}
.item{display:flex;gap:10px;align-items:center;padding:8px 18px;cursor:pointer;
  border-left:2px solid transparent}
.item:hover{background:#1a1e25}
.item.sel{background:#1a2333;border-left-color:var(--brand)}
.item .th{width:38px;height:30px;flex:0 0 38px;border-radius:4px;background:#0b0d10;
  object-fit:contain;background:#0b0d10;border:1px solid var(--line)}
.item .tx{min-width:0;flex:1}
.item .nm{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.item .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 6px}
.item .dot.busy{background:var(--warn)}
/* Closing an image belongs on the image, not in Advanced: "Remove from list" sat next
   to the tuning knobs, where it read as a setting rather than as an action on the row
   you had selected. Hidden until the row is hovered or selected so the list stays calm. */
.item .x{flex:0 0 18px;width:18px;height:18px;border:0;padding:0;border-radius:4px;
  background:transparent;color:var(--ink3);font-size:15px;line-height:1;opacity:0;
  transition:opacity .12s,background .12s,color .12s}
.item:hover .x,.item.sel .x{opacity:1}
.item .x:hover{background:#3a2326;color:#ff8080}
#modelcard{border-top:1px solid var(--line);padding:13px 18px;background:#13161b}
#modelcard .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
#modelcard .v{font-size:12px;margin-top:3px}
#modelcard .v b{font-weight:600}
#mpick{width:100%;margin:6px 0 7px;padding:6px 8px;font:inherit;font-size:12px;
  color:var(--ink);background:var(--surface2);border:1px solid var(--line2);
  border-radius:6px;cursor:pointer}
#mpick:hover{border-color:#3d4552}
#mpick:disabled{opacity:.5;cursor:default}
#scope{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}

/* ---------------- main ---------------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
/* wrap onto a second row when narrow rather than squeezing the controls: squeezing
   broke each tool label onto three lines, making the toolbar 99px tall at an 850px
   window. With .seg buttons set to nowrap they stay one line and the row wraps. */
#top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line2);
  border-radius:var(--r);overflow:hidden}
.seg{flex:0 0 auto}
.seg button{border:0;border-radius:0;background:transparent;padding:7px 13px;font-size:13px;
  color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff;font-weight:500}
.seg button:hover:not(.on){background:#232833;color:var(--ink)}
.sp{flex:1}
.menu{position:relative}
.menu .pop{position:absolute;top:calc(100% + 7px);right:0;z-index:40;min-width:230px;
  background:var(--surface2);border:1px solid var(--line2);border-radius:10px;
  box-shadow:var(--shadow);padding:6px;display:none}
.menu.open .pop{display:block}
.pop button{display:block;width:100%;text-align:left;background:transparent;border:0;
  border-radius:6px;padding:8px 10px;font-size:13px}
.pop button:hover{background:#282e39}
.pop .hint{font-size:11px;color:var(--ink3);padding:6px 10px 8px;line-height:1.45}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
#adv{padding:0 18px;background:#12151a;border-bottom:1px solid var(--line);
  max-height:0;overflow:hidden;transition:max-height .18s ease,padding .18s ease}
/* Cap is generous and scrolls rather than a tight fixed height: the row wraps as
   the window narrows, so a snug cap clips silently. Measured 136px at a 1100px
   window but 214px at 900px, where a 200px cap ate the note's last line. */
#adv.open{max-height:60vh;overflow-y:auto;padding:13px 18px}
.advrow{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.fld{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--ink2)}
.fld input[type=range]{width:118px;accent-color:var(--brand)}
.fld .num{font-variant-numeric:tabular-nums;color:var(--ink);min-width:34px}
.note{font-size:11px;color:var(--ink3);margin-top:9px;line-height:1.5;max-width:760px}
#prog{height:2px;background:var(--brand);width:0;transition:width .25s}
#stage{flex:1;overflow:auto;background:#0a0c0e;position:relative}
#wrap{position:relative;margin:0 auto}  /* sized in JS to the zoomed image */
#wrap img,#wrap canvas{position:absolute;top:0;left:0;display:block}
#wrap canvas{cursor:crosshair}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:13px;text-align:center;padding:30px}
#status{display:flex;gap:10px;align-items:center;padding:9px 18px;font-size:12px;
  color:var(--ink2);background:var(--surface);border-top:1px solid var(--line);min-height:36px}
#status .tag{font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line2);
  color:var(--ink3)}
.kbd{font:11px ui-monospace,monospace;background:#20242c;border:1px solid var(--line2);
  border-radius:4px;padding:1px 5px;color:var(--ink2)}
</style>
</head>
<body>

<aside id="side">
  <div class="brand">
    <h1>TXM Crack Detection</h1>
    <p>Load · review · correct · retrain</p>
  </div>

  <div id="drop">
    <b>Drop TXM images</b>
    <span>or click to browse — .tif .tiff .png</span>
  </div>
  <input type="file" id="file" multiple accept=".tif,.tiff,.png,.jpg" hidden>

  <div class="lbl">Images <span id="ncount" style="color:var(--ink3)"></span></div>
  <div id="list"></div>

  <div id="modelcard">
    <div class="k">Model</div>
    <select id="mpick" title="Switch models. Already-computed results appear instantly."></select>
    <div class="v" id="mdesc">loading…</div>
    <div id="scope"></div>
  </div>
</aside>

<main id="main">
  <div id="top">
    <!-- "Delete region" rather than the old "Remove area": the two removal tools differ
         only in scope, and the name is the only thing that can say so at a glance.
         Erase is a brush and takes what you drag over; Delete region is one click and
         takes a whole connected blob. Tooltips and the status-bar hint spell it out. -->
    <div class="seg" id="tools">
      <button data-mode="crack" class="on" title="Drag to add crack the model missed">Add crack</button>
      <button data-mode="erase" title="Drag to erase just the pixels your brush covers">Erase</button>
      <button data-mode="region" title="Click a whole region to flip it: crack -> not-crack (cyan), or back again">Flip region</button>
    </div>

    <label class="fld" style="gap:7px"><input type="checkbox" id="showmask" checked> Show result</label>

    <div class="sp"></div>

    <button class="ghost" id="advBtn" title="Threshold, post-processing, brush and zoom">Advanced ▾</button>

    <div class="menu" id="expMenu">
      <button class="ghost" id="expBtn">Export ▾</button>
      <div class="pop">
        <button data-exp="mask">Black &amp; white mask</button>
        <button data-exp="overlay">Overlay image</button>
        <button data-exp="csv">Measurements (CSV)</button>
        <hr>
        <button data-exp="all"><b>Everything, all images (.zip)</b></button>
        <div class="hint" id="exphint">Exports what you see now, with your corrections applied.</div>
      </div>
    </div>

    <button class="primary" id="retrain">Retrain</button>
  </div>

  <div id="adv">
    <div class="advrow">
      <div class="fld">Brush <input type="range" id="brush" min="2" max="120" value="24"><span class="num" id="brushv">24</span></div>
      <div class="fld">Zoom <input type="range" id="zoom" min="5" max="400" value="100"><span class="num" id="zoomv">100%</span>
        <button class="ghost" id="fit">Fit</button></div>
      <div class="fld">Sensitivity <input type="range" id="thr" min="5" max="95" value="50"><span class="num" id="thrv">0.50</span></div>
      <label class="fld" style="gap:7px"><input type="checkbox" id="pp"> Legacy post-processing</label>
      <div class="sp"></div>
      <button class="ghost" id="reapply" title="Re-predict every image with the current model">Re-apply model</button>
      <button class="ghost" id="undo2">Undo <span class="kbd">⌘Z</span></button>
      <button class="ghost danger" id="reset">Reset image</button>
    </div>
    <div class="note" id="advnote"></div>
  </div>

  <div id="prog"></div>
  <div id="stage">
    <div id="wrap"><img id="base"><img id="ovl"><canvas id="cv"></canvas></div>
    <div id="empty">Drop TXM images on the left to begin.</div>
  </div>
  <div id="status"><span id="msg">Ready.</span><span class="sp"></span><span class="tag" id="tag"></span></div>
</main>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let IMAGES=[],CUR=null,MODE="crack",DRAW=false,PTS=[],POLL=null,BUSY=false;
let STROKE_MODE="crack",READY=false,LASTK=0,FITTED=true;

const say=(t,c)=>{const e=$("#msg");e.textContent=t;e.style.color=c||"var(--ink2)";};
const tag=t=>{$("#tag").textContent=t||"";$("#tag").style.display=t?"":"none";};
const j=async(u,o)=>(await fetch(u,o)).json();
// Writes get their own helper because they are the only requests whose failure
// destroys the user's work. There is no save button -- a stroke is saved by the POST
// in the mouseup handler -- so if that POST rejects (server stopped, 500, laptop
// asleep) and nothing catches it, the stroke sits on the canvas looking painted
// while nothing reached disk, and the user finds out at the next reload. Never
// throws: always resolves to something with an .ok the caller must check.
const post=async(u,body)=>{
  try{
    const r=await fetch(u,body===undefined?{method:"POST"}
      :{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok)return{ok:false,error:`server returned ${r.status} ${r.statusText||""}`.trim()};
    return await r.json();
  }catch(e){return{ok:false,error:e&&e.message?e.message:"cannot reach the server"};}
};
const px=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,"")+"M"
  :n>=1e3?Math.round(n/1e3)+"k":String(n);
const q=()=>`?threshold=${($("#thr").value/100).toFixed(2)}&postprocess=${$("#pp").checked?1:0}`;

/* ---------- model + scope ---------- */
async function loadModel(){
  const m=await j("/api/model");
  $("#mdesc").innerHTML=`<b>${m.current.kind==="ensemble"?"SAM + 17-feature ensemble":"single model"}</b>`+
    (m.ground_truth_available?"":`<div style="color:var(--warn);font-size:11.5px;margin-top:4px">No ground truth — retraining cannot be validated.</div>`);
  await loadModelList();
}
// The picker lists every model the user has, newest first, and says which ones are
// already computed for the images loaded -- because that is exactly the difference
// between switching instantly and waiting for a prediction.
async function loadModelList(){
  const r=await j("/api/models").catch(()=>null);
  const sel=$("#mpick");
  if(!r||!r.ok||!r.models){sel.style.display="none";return;}
  sel.style.display="";
  sel.innerHTML=r.models.map(m=>{
    const n=m.n_images, ready=m.cached_for;
    const state=n===0?"":ready===n?" · ready":ready?` · ${ready}/${n} ready`:" · needs a pass";
    return `<option value="${m.id}"${m.current?" selected":""}>${m.label}${state}</option>`;
  }).join("");
}
async function switchModel(id){
  const sel=$("#mpick"),prev=[...sel.options].find(o=>o.defaultSelected)?.value;
  sel.disabled=true;say("switching model…");
  const r=await post("/api/model/select",{id,focus:CUR});
  if(!r.ok){sel.disabled=false;say(`could not switch — ${r.error}`,"var(--bad)");await loadModelList();return;}
  await loadModel();
  if(r.job){
    // Some images have never been run through this model. The one on screen was put
    // first in the queue, so refresh as each finishes rather than only at the end.
    say(`switched — predicting ${r.pending.length} image${r.pending.length==1?"":"s"}…`);
    watch(r.job,"Predicting");
  }else{
    sel.disabled=false;
    say(`switched to ${r.current.label} — ${r.instant.length} image${r.instant.length==1?"":"s"} from cache`,"var(--ok)");
    await loadList(true);if(CUR)show(CUR);
  }
}
function scope(){
  const ck=IMAGES.reduce((a,i)=>a+(i.corrected_crack_px||0),0);
  const nk=IMAGES.reduce((a,i)=>a+(i.corrected_not_px||0),0);
  const n=IMAGES.filter(i=>i.corrected_crack_px||i.corrected_not_px).length;
  const el=$("#scope"), btn=$("#retrain");
  if(!ck&&!nk){
    el.innerHTML=`<b style="color:var(--ink2)">Retrain</b> learns from your corrections.<br>Paint some first.`;
    btn.disabled=true; return;
  }
  btn.disabled=BUSY;
  const one=(!ck||!nk)?`<br><span style="color:var(--warn)">Paint some ${ck?"Erase":"Add crack"} too — retraining needs both.</span>`:"";
  el.innerHTML=`<b style="color:var(--ink2)">Retrain</b> will use ${px(ck)} crack + `+
    `${px(nk)} not-crack pixels from ${n} image${n==1?"":"s"}, plus 4 reference images.${one}`;
}

/* ---------- image list ---------- */
async function loadList(keep){
  IMAGES=(await j("/api/images")).images||[];
  $("#ncount").textContent=IMAGES.length?`(${IMAGES.length})`:"";
  // The zip is a single blocking request with no progress, and at 71 images it is
  // ~5 minutes and ~600 MB. Saying so beats leaving someone to wonder if it hung.
  const eh=$("#exphint");
  if(eh)eh.textContent="Exports what you see now, with your corrections applied."+
    (IMAGES.length>8?` The .zip covers ${IMAGES.length} images and takes a few minutes.`:"");
  const L=$("#list");L.innerHTML="";
  for(const im of IMAGES){
    const el=document.createElement("div");
    el.className="item"+(CUR===im.id?" sel":"");
    const ready=im.status==="ready";
    const pct=im.predicted_area!=null?(im.predicted_area*100).toFixed(1)+"% crack":im.status;
    const cor=im.corrected_crack_px||im.corrected_not_px?" · edited":"";
    // Say when a row's mask came from a model other than the current one, instead of
    // showing it as plain "ready" and letting the picker imply otherwise.
    const old=im.stale?` · <span style="color:var(--warn)">older model</span>`:"";
    el.innerHTML=`<span class="dot${ready?"":" busy"}"></span>`+
      (ready?`<img class="th" src="/api/image/${im.id}/thumb.png?w=128" loading="lazy">`:`<span class="th"></span>`)+
      `<span class="tx"><span class="nm">${im.filename||im.id}</span><span class="sub">${pct}${cor}${old}</span></span>`+
      `<button class="x" title="Remove ${im.filename||im.id} from the app (your original file is untouched)">\u00d7</button>`;
    el.onclick=()=>show(im.id);
    el.querySelector(".x").onclick=e=>{e.stopPropagation();removeImage(im.id,im.filename||im.id);};
    L.appendChild(el);
  }
  if(!keep&&!CUR&&IMAGES.length)show(IMAGES[0].id);
  scope();
}

async function show(id){
  CUR=id;READY=false;loadList(true);
  const im=IMAGES.find(x=>x.id===id)||{};
  $("#empty").style.display="none";
  if(im.status!=="ready"){
    // Hide the canvas while this image is still processing. CUR already points at the
    // new image, so leaving the previous one on screen means a stroke would be saved
    // against the new id using the old image's dimensions -- painting on the wrong
    // picture, at the wrong coordinates, with no visible sign of it.
    $("#wrap").style.visibility="hidden";
    say(`${im.filename||id}: ${im.status||"processing"}…`);return;
  }
  $("#wrap").style.visibility="visible";
  const w=im.width,h=im.height;
  $("#wrap").style.width=w+"px";$("#wrap").style.height=h+"px";
  for(const e of [$("#base"),$("#ovl")]){e.style.width=w+"px";e.style.height=h+"px";}
  const cv=$("#cv");cv.width=w;cv.height=h;cv.style.width=w+"px";cv.style.height=h+"px";
  cv.getContext("2d").clearRect(0,0,w,h);
  $("#base").src=`/api/image/${id}/display.png`;
  READY=true;
  refresh();fit();
  say(`${im.filename}`);
}
function refresh(){
  if(!CUR)return;
  $("#ovl").src=`/api/image/${CUR}/mask.png${q()}&r=${Date.now()}`;
  $("#ovl").style.display=$("#showmask").checked?"block":"none";
  updateTag();
}
// The status bar describes the mask on screen, so it has to be refetched whenever
// that mask changes -- a new sensitivity, the post-processing toggle, or a stroke.
// It was previously read once per image, which left it stale the moment you painted.
let TAGSEQ=0;
async function updateTag(){
  const iid=CUR,seq=++TAGSEQ;
  const im=IMAGES.find(x=>x.id===iid);if(!im)return;
  const st=await j(`/api/image/${iid}/stats${q()}`).catch(()=>null);
  if(!st||seq!==TAGSEQ||CUR!==iid)return;          // a newer request has superseded this
  if(st.area_fraction==null){tag(`${im.width}×${im.height}`);return;}
  tag(`${im.width}×${im.height} · ${(st.area_fraction*100).toFixed(2)}% crack · ${st.n_regions} regions`);
}
function fit(){
  const im=IMAGES.find(x=>x.id===CUR);if(!im)return;
  FITTED=true;                       // this zoom is ours, so a resize may recompute it
  const s=$("#stage");
  $("#zoom").value=Math.max(5,Math.min(400,Math.floor(Math.min(s.clientWidth/im.width,s.clientHeight/im.height)*100)));
  zoomed();
}
function zoomed(){
  const z=$("#zoom").value/100;
  $("#zoomv").textContent=$("#zoom").value+"%";
  const im=IMAGES.find(x=>x.id===CUR),s=$("#stage"),w=$("#wrap");
  if(!im){s.style.padding="0";return;}
  // Size the elements rather than transform:scale() them. A transform shrinks the
  // image visually but its absolutely positioned children keep claiming their full
  // unscaled size in the stage's scrollable area, which gave the stage ~739x911 px
  // of phantom scroll space at fit zoom -- scrollbars that scrolled into nothing.
  // Setting width/height keeps layout and visuals in agreement, so a scrollbar now
  // appears only when the image really is larger than the stage.
  const W=Math.round(im.width*z),H=Math.round(im.height*z);
  w.style.width=W+"px";w.style.height=H+"px";
  for(const el of [$("#base"),$("#ovl"),$("#cv")]){el.style.width=W+"px";el.style.height=H+"px";}
  // Horizontal centring is #wrap's `margin:0 auto` -- no JS needed, and an auto
  // margin collapses to 0 once the image is wider than the stage, so it overflows
  // into the scrollbar instead of being clipped. Only the vertical needs padding.
  s.style.paddingTop=Math.max(0,(s.clientHeight-H)/2)+"px";
}

// On resize: re-fit if the current zoom came from Fit, otherwise just re-centre.
// Re-centring alone was not enough -- open the app in a short window and the zoom
// computed for that stage sticks, so enlarging the window leaves the image a stamp in
// the middle of a lot of black. Re-fitting unconditionally is also wrong: it would
// throw away a zoom the user set by hand every time the window moved.
addEventListener("resize",()=>{if(!CUR)return;FITTED?fit():zoomed();});

/* ---------- painting ---------- */
// Scale from the canvas's own measured rect rather than the zoom slider: exact
// regardless of rounding in the displayed size, and independent of how the zoom
// is applied.
const xy=e=>{const c=$("#cv"),r=c.getBoundingClientRect();
  return [(e.clientX-r.left)*(c.width/r.width),(e.clientY-r.top)*(c.height/r.height)];};
function dot(x,y){const c=$("#cv").getContext("2d");
  c.fillStyle=MODE==="crack"?"rgba(70,225,140,.85)":"rgba(90,160,255,.85)";
  c.beginPath();c.arc(x,y,+$("#brush").value,0,7);c.fill();}

$("#cv").addEventListener("mousedown",async e=>{
  if(!CUR||!READY)return;      // not ready = no canvas to map coordinates against
  if(MODE==="region"){
    const [x,y]=xy(e);say("removing area…");
    const r=await post(`/api/image/${CUR}/flip_region`,
      {x,y,mode:"toggle",threshold:+($("#thr").value/100).toFixed(2),postprocess:$("#pp").checked});
    if(!r.ok){say(r.error||"nothing there","var(--warn)");return;}
    refresh();loadList(true);
    // Say WHICH region was taken and WHICH WAY it went. Clicking a red blob and clicking
    // a grey artifact are the same gesture but different labels, and a second click on
    // the same region flips it back -- the user should not have to guess any of that.
    const what={"prediction":"predicted region","weak activation":"region the model half-marked"}[r.source]
      ||(r.source&&r.source.startsWith("darkness")?"dark area":"region");
    say(r.flipped_back
        ?`flipped ${r.region_px.toLocaleString()} px back to crack — ⌘Z to undo`
        :`marked ${r.region_px.toLocaleString()} px of ${what} as not-crack (cyan) — click again to flip back`,
        "var(--ok)");return;
  }
  // Remember which tool drew this stroke: the save happens after an await and the
  // user may have switched tools by then.
  DRAW=true;PTS=[];STROKE_MODE=MODE;const [x,y]=xy(e);PTS.push([x,y]);dot(x,y);
});
$("#cv").addEventListener("mousemove",e=>{if(!DRAW||MODE==="region")return;const [x,y]=xy(e);PTS.push([x,y]);dot(x,y);});
addEventListener("mouseup",async()=>{
  if(!DRAW)return;DRAW=false;
  if(!PTS.length||!CUR)return;
  // Take ownership of this stroke's points and target BEFORE awaiting. Clearing PTS
  // after the await would wipe a stroke the user had already begun during the save,
  // and reading CUR after it would post to whichever image they had since clicked.
  const pts=PTS,iid=CUR,mode=STROKE_MODE;PTS=[];
  const r=await post(`/api/image/${iid}/correction`,{mode,points:pts,radius:+$("#brush").value});
  // On failure keep the stroke drawn on the canvas: it is the only remaining record
  // of it, and clearing it would make a lost stroke look like a saved one.
  if(!r.ok){say(`NOT saved — ${r.error}. Your stroke is still on screen; paint it again once the server is back.`,"var(--bad)");return;}
  // Only wipe the preview if nothing new is being drawn and we are still on the same
  // image -- otherwise this erases someone's in-progress stroke.
  if(!DRAW&&CUR===iid)$("#cv").getContext("2d").clearRect(0,0,$("#cv").width,$("#cv").height);
  if(CUR===iid)refresh();
  loadList(true);
  say(`saved — ⌘Z to undo`,"var(--ok)");
});

/* ---------- upload ---------- */
const drop=$("#drop");
drop.onclick=()=>$("#file").click();
["dragenter","dragover"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add("hot")}));
["dragleave","drop"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove("hot")}));
drop.addEventListener("drop",e=>up(e.dataTransfer.files));
$("#file").onchange=e=>up(e.target.files);
// dropping anywhere on the canvas works too -- people aim at the image
["dragenter","dragover"].forEach(v=>$("#stage").addEventListener(v,e=>e.preventDefault()));
$("#stage").addEventListener("drop",e=>{e.preventDefault();up(e.dataTransfer.files)});

async function up(files){
  if(!files||!files.length)return;
  const fd=new FormData();for(const f of files)fd.append("files",f);
  say(`uploading ${files.length} file${files.length==1?"":"s"}…`);
  const r=await j("/api/upload",{method:"POST",body:fd});
  if(!r.ok){say("upload failed: "+r.error,"var(--bad)");return;}
  await loadList(true);
  // Some files can be skipped while others load; say so rather than leaving the
  // user to notice the list is shorter than what they dropped.
  if(r.rejected&&r.rejected.length)say(`skipped ${r.rejected.join(", ")} — unreadable format`,"var(--warn)");
  r.job?watch(r.job,"Processing"):say(r.rejected&&r.rejected.length?"nothing to process":"already processed");
}

/* ---------- jobs ---------- */
function watch(jid,what){
  clearInterval(POLL);BUSY=true;$("#retrain").disabled=true;$("#mpick").disabled=true;
  POLL=setInterval(async()=>{
    const s=await j(`/api/job/${jid}`);
    $("#prog").style.width=(s.n?Math.round(100*s.k/s.n):0)+"%";
    if(s.state==="running"){
      say(`${what}: ${s.stage}${s.n?` (${s.k}/${s.n})`:""}`);
      // The image on screen is predicted first, so show its result as soon as the
      // job moves past it instead of making the user wait for the whole queue.
      if(CUR&&s.k>1&&s.k!==LASTK){LASTK=s.k;refresh();loadList(true);}
      return;
    }
    clearInterval(POLL);$("#prog").style.width="0";BUSY=false;$("#mpick").disabled=false;LASTK=0;
    if(s.state==="error"){say(`${what} failed — ${s.error}`,"var(--bad)");console.error(s.trace);scope();
      loadModelList();return;}
    const res=s.result||{};
    if(res.info!==undefined||res.error){                       // a retrain result
      if(!res.ok){say(res.error||"retraining refused","var(--warn)");scope();return;}
      let m=`Retrained on ${res.info.n_px.toLocaleString()} pixels`;
      if(res.incumbent)m+=` · accuracy ${res.incumbent.iou.toFixed(3)} → ${res.candidate.iou.toFixed(3)}`;
      await loadModel();
      if(res.deployed){
        // The retrain job now re-applies the new model to every image server-side,
        // so there is nothing to chain from here and nothing is lost if this tab was
        // closed while it ran. Older servers did not, hence the fallback.
        if(res.reapplied!=null){
          const bad=(res.reapply_failed||[]).length;
          say(m+` — re-applied to ${res.reapplied} image${res.reapplied==1?"":"s"}`+(bad?`, ${bad} failed`:""),
              bad?"var(--warn)":"var(--ok)");
          await loadList(true);if(CUR)show(CUR);scope();return;
        }
        say(m+" — applying to your images…","var(--ok)");
        const rr=await j("/api/reoverlay",{method:"POST"});watch(rr.job,"Updating results");return;}
      say(m+` · not applied (${res.reason||"no improvement"}) — previous model kept`,"var(--warn)");
    }else say(`${what} complete`,"var(--ok)");
    await loadList(true);if(CUR)show(CUR);scope();
    loadModelList();          // "needs a pass" -> "ready" once a model has been run
  },900);
}

/* ---------- actions ---------- */
$("#retrain").onclick=async()=>{
  const ck=IMAGES.reduce((a,i)=>a+(i.corrected_crack_px||0),0);
  const nk=IMAGES.reduce((a,i)=>a+(i.corrected_not_px||0),0);
  const n=IMAGES.filter(i=>i.corrected_crack_px||i.corrected_not_px).length;
  if(!confirm(`Retrain the model?\n\nLearns from ${ck.toLocaleString()} crack and `+
    `${nk.toLocaleString()} not-crack pixels you painted across ${n} image${n==1?"":"s"}, `+
    `plus 4 reference images.\n\nTakes a few minutes. The new model is only used if it `+
    `scores at least as well as the current one; otherwise nothing changes.\n\n`+
    `Your images are updated automatically if it is used.`))return;
  watch((await j("/api/retrain",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).job,"Retraining");
};
$$("[data-exp]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.exp;$("#expMenu").classList.remove("open");
  if(k==="all"){say("building archive…");location=`/api/export/all.zip${q()}`;return;}
  if(!CUR){say("select an image first","var(--warn)");return;}
  location=`/api/export/${CUR}/${k==="mask"?"mask.png":k==="overlay"?"overlay.png":"stats.csv"}${q()}`;
});
$("#expBtn").onclick=e=>{e.stopPropagation();$("#expMenu").classList.toggle("open")};
addEventListener("click",()=>$("#expMenu").classList.remove("open"));

$("#advBtn").onclick=()=>{
  const o=$("#adv").classList.toggle("open");
  $("#advBtn").textContent="Advanced "+(o?"▴":"▾");
  $("#advnote").innerHTML=o?`<b>Sensitivity</b> lowers or raises how much the model marks — 0.50 is the calibrated default. `+
    `<b>Legacy post-processing</b> reproduces the older pipeline's cleanup; it is off because it measurably removes thin cracks `+
    `(−0.08 accuracy, −0.07 of the crack found).`:"";
  // Opening or closing the panel changes the stage's height, so the vertical
  // centring padding computed for the old height is now wrong.
  if(CUR)setTimeout(zoomed,200);
};

async function undo(){
  if(DRAW&&PTS.length){DRAW=false;PTS=[];$("#cv").getContext("2d").clearRect(0,0,$("#cv").width,$("#cv").height);
    say("stroke cancelled");return;}
  if(!CUR)return;
  const r=await post(`/api/image/${CUR}/undo`);
  // An empty undo stack and an unreachable server are different things: reporting
  // both as "nothing to undo" would tell someone their history is gone when the
  // request never arrived.
  if(!r.ok){say(r.error?`undo failed — ${r.error}`:"nothing to undo",r.error?"var(--bad)":"var(--warn)");return;}
  refresh();loadList(true);say(`undone · ${r.undo_depth} step${r.undo_depth==1?"":"s"} left`,"var(--ok)");
}
$("#undo2").onclick=undo;
addEventListener("keydown",e=>{
  if((e.key==="z"||e.key==="Z")&&(e.metaKey||e.ctrlKey)&&!e.shiftKey){e.preventDefault();undo();}
  if(e.key==="1")setMode("crack");if(e.key==="2")setMode("erase");if(e.key==="3")setMode("region");
});
$("#reset").onclick=async()=>{
  if(!CUR||!confirm("Erase your corrections on this image?\n\n⌘Z restores them."))return;
  const r=await post(`/api/image/${CUR}/correction`,{mode:"clear"});
  if(!r.ok){say(`could not erase — ${r.error}`,"var(--bad)");return;}
  refresh();loadList(true);say("corrections erased — ⌘Z to restore");
};
// Takes the id explicitly: the x belongs to its own row, so removing one image must not
// depend on which row is currently selected.
async function removeImage(id,name){
  if(BUSY){say("finish the current job first","var(--warn)");return;}
  const im=IMAGES.find(x=>x.id===id)||{};
  const edited=(im.corrected_crack_px||0)+(im.corrected_not_px||0);
  const warn=edited?`\n\nThis image has ${edited.toLocaleString()} corrected pixels. They will be deleted and cannot be recovered.`:"";
  if(!confirm(`Remove ${name} from the app?${warn}\n\nYour original file is untouched.`))return;
  try{const d=await fetch(`/api/image/${id}`,{method:"DELETE"});
    if(!d.ok){say(`could not remove — server returned ${d.status}`,"var(--bad)");return;}
  }catch(e){say(`could not remove — ${e.message||"cannot reach the server"}`,"var(--bad)");return;}
  if(CUR===id){CUR=null;READY=false;$("#wrap").style.visibility="hidden";tag("");}
  await loadList();say(`removed ${name}`);
  if(!IMAGES.length){$("#empty").style.display="flex";tag("");}
  else if(!CUR)show(IMAGES[0].id);
}

// Erase and Delete region both remove crack, and nothing on screen used to say how
// they differ, so the active tool now explains itself in the status bar.
const TOOL_HINT={
  crack:"Drag to paint crack the model missed. Brush size is under Advanced.",
  erase:"Drag to erase — removes only the pixels your brush passes over.",
  region:"One click marks a whole region as not-crack (shown cyan) — a red blob, or an artifact the model got wrong. Click it again to flip it back to crack.",
};
function setMode(m){MODE=m;$$("#tools button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  $("#cv").style.cursor=m==="region"?"pointer":"crosshair";
  say(TOOL_HINT[m]||"");}
$$("#tools button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("#brush").oninput=e=>$("#brushv").textContent=e.target.value;
$("#zoom").oninput=()=>{FITTED=false;zoomed();};   // hand-set zoom survives a resize
$("#fit").onclick=fit;
$("#showmask").onchange=refresh;
// Legacy post-processing derives its own mask and ignores the threshold entirely
// (pipeline.effective_mask: postprocess ? M.postprocess(prob) : prob > threshold),
// so leaving Sensitivity live while it is on presents a control that does nothing.
// Grey it out and say why instead of letting someone drag it and see no change.
function syncThrEnabled(){
  const off=$("#pp").checked;
  $("#thr").disabled=off;
  const f=$("#thr").closest(".fld");
  f.style.opacity=off?".45":"";
  f.title=off?"Legacy post-processing computes its own mask and ignores Sensitivity":"";
}
$("#mpick").onchange=e=>switchModel(e.target.value);
// Recovery path for the case the model-switch job died partway: the registry says one
// model, some images still hold another's prediction (their rows read "older model").
// Nothing else in the UI could fix that without deleting and re-uploading the image.
$("#reapply").onclick=async()=>{
  if(BUSY)return;
  const r=await post("/api/reoverlay");
  if(!r.ok){say(`could not re-apply — ${r.error}`,"var(--bad)");return;}
  watch(r.job,"Re-applying model");
};
$("#pp").onchange=()=>{syncThrEnabled();refresh();};
$("#thr").oninput=e=>$("#thrv").textContent=(e.target.value/100).toFixed(2);
$("#thr").onchange=refresh;
syncThrEnabled();

loadModel();loadList();
</script>
</body>
</html>
